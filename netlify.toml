[build]
  base    = "frontend"
  publish = "dist"
  command = "npm run build"

[build.environment]
  # Set VITE_API_BASE_URL to your Render backend URL in Netlify Site Settings → Environment variables
  # Example: VITE_API_BASE_URL = "https://appdoctor-ai-backend.onrender.com"
  NODE_VERSION = "20"

[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
